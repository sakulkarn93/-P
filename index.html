<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7c8d7">
  <title>คิดถึงหนูไหม?</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      font-family: Tahoma, "Noto Sans Thai", sans-serif;
      color: #633d4a;
      background:
        radial-gradient(circle at 14% 16%, rgba(255,255,255,.75) 0 5%, transparent 6%),
        radial-gradient(circle at 86% 24%, rgba(255,255,255,.5) 0 4%, transparent 5%),
        linear-gradient(145deg, #f7c8d7, #fff2f6 52%, #f4bdcf);
      touch-action: manipulation;
    }

    .app {
      position: relative;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
    }

    .page {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      opacity: 0;
      transform: translateY(20px) scale(.98);
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease;
    }

    .page.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .card {
      width: min(92vw, 470px);
      min-height: 390px;
      padding: 34px 24px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 30px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 24px 70px rgba(123,55,80,.18);
      backdrop-filter: blur(12px);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .small-title {
      margin-bottom: 10px;
      font-size: 14px;
      letter-spacing: .1em;
      color: #b55d7c;
    }

    h1 {
      margin: 0;
      font-size: clamp(31px, 8vw, 47px);
      line-height: 1.35;
      color: #cf567d;
    }

    .subtitle {
      margin: 17px auto 0;
      max-width: 340px;
      font-size: 16px;
      line-height: 1.7;
      color: #75535f;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 90px;
      margin-top: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    button {
      min-width: 118px;
      border: 0;
      border-radius: 999px;
      padding: 14px 25px;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      box-shadow: 0 9px 20px rgba(119,45,72,.18);
    }

    .yes-btn {
      background: #de6388;
      color: #fff;
    }

    .yes-btn:active {
      transform: scale(.96);
    }

    .no-placeholder {
      width: 118px;
      height: 52px;
      flex: 0 0 118px;
    }

    .no-btn {
      position: fixed;
      z-index: 100;
      display: none;
      background: #fff;
      color: #bd5878;
      border: 1px solid #f0c4d2;
      transition: left .14s ease, top .14s ease;
    }

    .message-card h1 {
      font-size: clamp(28px, 7.5vw, 43px);
    }

    .heart {
      margin-top: 18px;
      font-size: 68px;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .decor {
      position: fixed;
      color: rgba(207,86,125,.19);
      font-size: 54px;
      pointer-events: none;
      user-select: none;
    }

    .decor.one { top: 5%; left: 5%; transform: rotate(-15deg); }
    .decor.two { right: 5%; bottom: 7%; transform: rotate(17deg); }
    .decor.three { right: 9%; top: 11%; font-size: 30px; }

    @media (max-width: 430px) {
      .card {
        min-height: 400px;
        padding: 30px 18px;
        border-radius: 26px;
      }

      .buttons {
        gap: 10px;
      }

      button {
        min-width: 112px;
      }

      .no-placeholder {
        width: 112px;
        flex-basis: 112px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="decor one">♡</div>
    <div class="decor two">♡</div>
    <div class="decor three">♡</div>

    <section class="page active" id="questionPage">
      <div class="card">
        <h1>คิดถึงหนูไหม?</h1>

        <div class="buttons">
          <button type="button" class="yes-btn" id="yesBtn">Yes</button>
          <div class="no-placeholder" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <section class="page" id="messagePage">
      <div class="card message-card">
        <h1>หนูก็คิดถึงพี่ </h1>
         <h1>⸜(｡˃ ᵕ ˂ )⸝♡ </h1>
        <div class="heart">♡</div>
      </div>
    </section>

    <button type="button" class="no-btn" id="noBtn">No</button>
  </div>

  <script>
    const questionPage = document.getElementById("questionPage");
    const messagePage = document.getElementById("messagePage");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    let noMoved = false;

    function showQuestion() {
      questionPage.classList.add("active");
      messagePage.classList.remove("active");
      noBtn.style.display = "block";
      setTimeout(placeNoBesideYes, 80);
    }

    function showMessage() {
      questionPage.classList.remove("active");
      messagePage.classList.add("active");
      noBtn.style.display = "none";
    }

    function placeNoBesideYes() {
      const rect = yesBtn.getBoundingClientRect();
      const gap = 10;
      const width = noBtn.offsetWidth || 112;
      const height = noBtn.offsetHeight || 52;

      let left = rect.right + gap;
      let top = rect.top + (rect.height - height) / 2;

      left = Math.min(left, window.innerWidth - width - 12);
      top = Math.max(12, Math.min(top, window.innerHeight - height - 12));

      noBtn.style.left = left + "px";
      noBtn.style.top = top + "px";
    }

    function moveNoButton(event) {
      if (event) event.preventDefault();

      noMoved = true;

      const padding = 14;
      const width = noBtn.offsetWidth || 112;
      const height = noBtn.offsetHeight || 52;
      const maxX = Math.max(padding, window.innerWidth - width - padding);
      const maxY = Math.max(padding, window.innerHeight - height - padding);

      noBtn.style.left =
        (padding + Math.random() * Math.max(1, maxX - padding)) + "px";
      noBtn.style.top =
        (padding + Math.random() * Math.max(1, maxY - padding)) + "px";
    }

    yesBtn.addEventListener("click", showMessage);

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("pointerdown", moveNoButton);
    noBtn.addEventListener("touchstart", moveNoButton, { passive: false });
    noBtn.addEventListener("click", moveNoButton);

    window.addEventListener("resize", () => {
      if (!noMoved) placeNoBesideYes();
    });

    window.addEventListener("load", showQuestion);
  </script>
</body>
</html>
